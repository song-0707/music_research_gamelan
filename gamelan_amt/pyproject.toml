[project]
name = "gamelan-amt"
version = "0.1.0"
description = "LoRA adaptation of MuScriptor for non-12-TET gamelan transcription"
requires-python = ">=3.10,<3.13"
dependencies = [
    "muscriptor==0.4.0",      # pinned: transcribe.py uses a private method of this version
    "mir_eval>=0.7",
    "librosa>=0.10",
    "soundfile>=0.12",
    "scipy>=1.10",
    "pyyaml>=6",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gamelan_amt*"]
